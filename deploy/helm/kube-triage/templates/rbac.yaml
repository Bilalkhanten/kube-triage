{{- if .Values.rbac.create }}
{{- if .Values.rbac.namespaces }}
{{- range .Values.rbac.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-triage.fullname" $ }}-read
  namespace: {{ . }}
  labels:
    {{- include "kube-triage.labels" $ | nindent 4 }}
rules:
  {{- include "kube-triage.readOnlyRules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-triage.fullname" $ }}-read
  namespace: {{ . }}
  labels:
    {{- include "kube-triage.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-triage.fullname" $ }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-triage.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-triage.fullname" . }}-read
  labels:
    {{- include "kube-triage.labels" . | nindent 4 }}
rules:
  {{- include "kube-triage.readOnlyRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-triage.fullname" . }}-read
  labels:
    {{- include "kube-triage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-triage.fullname" . }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-triage.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
