{{- $dbSecret := required "api.database.existingSecret is required (a Secret holding DATABASE_URL)" .Values.api.database.existingSecret }}
{{- $keySecret := required "api.apiKeys.existingSecret is required (a Secret holding KUBE_TRIAGE_API_KEYS)" .Values.api.apiKeys.existingSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-triage.fullname" . }}-api
  labels:
    {{- include "kube-triage.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kube-triage.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "kube-triage.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "kube-triage.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: {{ .Values.api.database.key }}
            - name: KUBE_TRIAGE_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ $keySecret }}
                  key: {{ .Values.api.apiKeys.key }}
            {{- with .Values.api.connectors.prometheusUrl }}
            - name: PROMETHEUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.connectors.lokiUrl }}
            - name: LOKI_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.connectors.githubDeploysRepo }}
            - name: GITHUB_DEPLOYS_REPO
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.connectors.githubDeploysEnvironment }}
            - name: GITHUB_DEPLOYS_ENVIRONMENT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.rbac.podLogs }}
            - name: KUBE_TRIAGE_POD_LOGS
              value: "1"
            {{- end }}
            {{- range .Values.api.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
            {{- range $name, $value := .Values.api.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-triage.fullname" . }}-api
  labels:
    {{- include "kube-triage.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.apiPort }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "kube-triage.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
